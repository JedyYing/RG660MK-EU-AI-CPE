# RG660MK 姿态/坐姿检测服务配置(pose-only)
# 由 pose_camera_arm64 与 procd 服务共同读取;所有项可改。
# 部署路径由 install.sh 依据 df 选择,默认 /data/pose 或 /overlay/pose。

# 摄像头(Logitech C270 默认 046d:0825;换摄像头改这里)
CAM_VID=0x046d
CAM_PID=0x0825
CAM_FPS=15

# 推理参数
MODEL_DIR=./models/pose_320      # 模型目录(含 model.ncnn.param/bin)
INPUT_SIZE=320                    # 320 / 416 / 640,须与 MODEL_DIR 的导出尺寸一致
THREADS=2                         # 1..4;T930=4x 同构 A55,仅线程调优,不绑核
PROC_FPS=0                        # 0=尽力而为;>0 限制处理频率(降 CPU)

# 阈值(与 PC 基线一致)
CONF_THRESH=0.35
KPT_THRESH=0.40
NMS_THRESH=0.45

# 坐姿几何阈值
SHOULDER_TILT=10.0
HEAD_DROP=-0.15
HEAD_FORWARD=0.35
TRUNK_TILT=12.0

# 时间平滑 / 告警
SMOOTH_WINDOW=5                   # 最近 N 帧多数表决
ALERT_HOLD_SEC=2.0                # 异常持续 >=2s 才告警

# 输出
OUT_JSONL=./logs/pose_stream.jsonl
NICE=10                           # 进程 nice 优先级(越大越让路,保 CPE 主业务)
